[package]
name = "zlaunch"
version = "0.5.1"
edition = "2024"
description = "A fast application launcher for Linux wayland desktops built with GPUI."
repository = "https://github.com/zortax/zlaunch"
license = "MIT"
authors = ["Leonard Seibold <git@zrtx.de>"]

[dependencies]
gpui-kit = { version = "0.11", default-features = false, features = ["component", "assets"] }
rust-embed = "8"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
freedesktop-desktop-entry = "0.8"
freedesktop-icons = "0.4"
dirs = "7"
flume = { version = "0.12", default-features = false, features = ["async"] }
fuzzy-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazy_static = "1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fend-core = "1.5"
wl-clipboard-rs = "0.9"
regex = "1"
emojis = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
urlencoding = "2"
llm = { version = "1.3", default-features = false, features = ["ollama", "google", "openai", "openrouter"] }
futures = "0.3"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tarpc = { version = "0.38", features = ["serde-transport", "tokio1", "serde1"] }
tokio-serde = { version = "0.9", features = ["json"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1"
libc = "0.2"
zbus = "6"
notify = "9"
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
